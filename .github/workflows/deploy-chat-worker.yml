name: Deploy Data Quest AI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Deploy secure AI backend
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Faltan los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID." >&2
            exit 1
          fi
          OUTPUT="$(wrangler deploy 2>&1)"
          echo "$OUTPUT"
          WORKER_URL="$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://data-quest-chat\.[a-zA-Z0-9.-]+\.workers\.dev' | tail -n 1)"
          if [ -z "$WORKER_URL" ]; then
            echo "No se pudo detectar la URL workers.dev en la salida de Wrangler." >&2
            exit 1
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Configure OpenAI key on Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "Falta el secreto OPENAI_API_KEY." >&2
            exit 1
          fi
          printf '%s' "$OPENAI_API_KEY" | wrangler secret put OPENAI_API_KEY

      - name: Connect website to Worker
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path("script.js")
          source = path.read_text(encoding="utf-8")
          old = 'const CHAT_API_URL = window.DATA_QUEST_CHAT_API || "";'
          new = 'const CHAT_API_URL = window.DATA_QUEST_CHAT_API || "' + os.environ["WORKER_URL"] + '/api/chat";'
          if old in source:
              path.write_text(source.replace(old, new, 1), encoding="utf-8")
          elif new not in source:
              raise SystemExit("No se encontró la configuración esperada del chat; no se modificó script.js.")
          PY
          if ! git diff --quiet -- script.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add script.js
            git commit -m "Conecta el asistente IA con Cloudflare Worker"
            git push
          fi
